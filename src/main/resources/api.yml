openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: API para crear, consultar y eliminar órdenes.
servers:
  - url: http://localhost:8080
    description: API Gateway
tags:
  - name: Órdenes
paths:
  /api/orders:
    post:
      tags:
        - Órdenes
      summary: Crear una orden
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Orden creada correctamente
          headers:
            Location:
              description: URI de la orden creada
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró el cliente o alguno de los productos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Órdenes
      summary: Obtener todas las órdenes
      operationId: getOrders
      responses:
        '200':
          description: Listado de órdenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  /api/orders/{orderId}:
    delete:
      tags:
        - Órdenes
      summary: Eliminar una orden
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          required: true
          description: Identificador de la orden
          schema:
            type: string
      responses:
        '204':
          description: Orden eliminada correctamente
        '404':
          description: No se encontró la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - customerId
        - items
      properties:
        customerId:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    CreateOrderItem:
      type: object
      additionalProperties: false
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: '1'
        quantity:
          type: integer
          minimum: 1
          example: 2
    Order:
      type: object
      required:
        - id
        - customerId
        - customerName
        - customerLastName
        - items
        - total
        - createdAt
      properties:
        id:
          type: string
          example: 'ord-1001'
        customerId:
          type: integer
          format: int64
          example: 1
        customerName:
          type: string
          example: Juan
        customerLastName:
          type: string
          example: Pérez
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
          format: double
          minimum: 0
          example: 2401.00
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T12:00:00Z'
    OrderItem:
      type: object
      required:
        - productId
        - productName
        - quantity
        - unitPrice
        - subtotal
      properties:
        productId:
          type: string
          example: '1'
        productName:
          type: string
          example: Laptop Lenovo ThinkPad
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPrice:
          type: number
          format: double
          minimum: 0
          example: 1200.5
        subtotal:
          type: number
          format: double
          minimum: 0
          example: 2401.00
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: No se encontró el recurso solicitado.
